[uwsgi]
# 用于和Nginx进行数据交互的端口
socket = 127.0.0.1:8000

# Django项目的根目录，使用绝对路径
chdir = /www/wwwroot/Phoenix

# wsgi.py在Django项目中的位置
module  = dm_django.wsgi:application

# 启动主进程，来管理其他进程
master = true

 # 最大开启的进程数
processes = 2

# 每个进程的线程数
threads = 5

# 当服务器退出的时候自动删除unix socket文件和pid文件，避免在下次启动服务器时出现文件冲突或占用的问题
vacuum = true