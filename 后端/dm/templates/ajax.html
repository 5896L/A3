<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <title>Document</title>
</head>
<body> 
    <div id="root">
        <h1>Hello, {{name}}.</h1>
        <a v-bind:href="url" :x="hello">click to Baidu</a>
        <hr>
        <br>
        单向数据绑定: <input type="text" :value="name">
        双向数据绑定: <input type="text" v-model:value="name">

        <br>
        <button v-on:click="showInfo">click to show Info!</button>
        <br>
        <input placeholder="who are you" @keydown.ctrl="showInfo">
        <br><br>
        
        姓： <input type="text" v-model:value="firstName">
        <br>
        名： <input type="text" v-model:value="secondName">
        <br>
        <span>{{fullname}}</span>  <br>
        
        <br>
        <span>the weather is {{showWeather}} today</span>   <br>
        <button @click="switchWeather">click to switch the weather</button>

        <br>    <hr>
        <span>{{info}}</span>


    </div>
    
    <script type="text/javascript">
        // 创建 Vue
        const x = new Vue({
            el: '#root',
            data: {
                name: "World",
                age: "18",
                url: "http://www.baidu.com",
                hello: "ww",
                firstName: "Zhang",
                secondName: "San",
                isHot: false,
                info: null

            },

            computed:{
                fullname() {
                        return this.firstName + "-" + this.secondName   
                },

                showWeather() {
                    return this.isHot ? "hot" : "cold"
                }
            },
            

            methods:{
                showInfo(event) {
                    console.log(event.key, event.keyCode)
                    console.log(event.target.value)
                },

                switchWeather(e) {
                    this.isHot = !this.isHot
                }

            },

            mounted () {
                axios
                .get('/dm_global_status_tps/')
                .then(response => (this.info = response))
                .catch(function (error) { // 请求失败处理
                    console.log(error);
                });
            }
        })
        


    </script>
</body>
</html>
